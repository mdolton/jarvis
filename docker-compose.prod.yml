# Production stack: pulls the pre-built image from ghcr.io instead of building.
# Build & push the image from a dev machine with `make deploy`, then on the
# server run `make prod-pull && make prod-up` (or use docker compose directly).
#
# Pin a specific build by exporting JARVIS_IMAGE_TAG (defaults to latest):
#   JARVIS_IMAGE_TAG=292030c docker compose -f docker-compose.prod.yml up -d
services:
  jarvis:
    image: ghcr.io/mdolton/jarvis:${JARVIS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${JARVIS_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - JARVIS_LLM_BASE_URL
      - JARVIS_LLM_API_KEY
      - JARVIS_LLM_MODEL
      - JARVIS_DISCORD_TOKEN
      - JARVIS_DISCORD_ALLOWED_USER_IDS
      - JARVIS_TIMEZONE
      - JARVIS_LOG_LEVEL
      - JARVIS_BASE_URL
      - JARVIS_SECRETS_KEY
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
    extra_hosts:
      - "host.docker.internal:host-gateway"
