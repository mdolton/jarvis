[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI agent service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "watchfiles>=0.22",
  "openai-agents>=0.7",
  "openai>=1.68",
  "typer>=0.12",
  "discord.py>=2.3",
  "apscheduler>=4.0.0a1",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
