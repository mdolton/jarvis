name: Docker

# Build the container image on every PR (validation only) and build + push it
# to GitHub Container Registry on pushes to main and version tags.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check jarvis tests

      - name: Test
        timeout-minutes: 10
        run: uv run pytest -vv --durations=20

      - name: Config smoke
        run: |
          mkdir -p config
          cp config/jarvis.yaml.example config/jarvis.yaml
          uv run python -m jarvis check-config
        env:
          JARVIS_LLM_BASE_URL: http://localhost:1234/v1
          JARVIS_LLM_API_KEY: dummy
          JARVIS_LLM_MODEL: test-model
          JARVIS_TIMEZONE: UTC
          JARVIS_SECRETS_KEY: 6OlPq8cM1w8Nxj5tJ7Mc19uZrbeGieG2Lz9HnKnmrJA=

  build:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Only authenticate to the registry when we intend to push (not on PRs,
      # which may come from forks without registry write access).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
