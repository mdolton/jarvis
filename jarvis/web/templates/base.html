<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Jarvis{% endblock %}</title>
    <!-- allowEval:false lets the CSP drop 'unsafe-eval' (nothing here uses
         hx-on / hx-vals js: — grep before turning it back on).
         includeIndicatorStyles:false stops htmx injecting an inline <style>
         for hx-indicator, which style-src 'self' blocks; if indicators are
         ever wanted, put the .htmx-indicator rules in style.css instead. -->
    <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/htmx-ext-sse.js"></script>
</head>
<!-- Body-level hx-headers: every hx-post/hx-delete on the page inherits the
     CSRF header without per-element annotation. -->
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
    <header class="topbar">
        <a class="brand" href="/">Jarvis</a>
        <nav>
            <a href="/">Home</a>
            <a href="/conversations">Conversations</a>
            <a href="/memory">Memory</a>
            <a href="/schedules">Schedules</a>
            <a href="/templates">Templates</a>
            <a href="/actions">Actions</a>
            <a href="/mcp">MCP</a>
            <a href="/errors">Errors</a>
            <a href="/audit">Audit</a>
            <a href="/settings">Settings</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <dialog id="step-up-modal" class="step-up-modal">
        <h2>Confirm it's you</h2>
        <p>This action touches sensitive settings and needs a fresh passkey confirmation.</p>
        <p id="step-up-error" class="step-up-error"></p>
        <div class="step-up-buttons">
            <button id="step-up-confirm" type="button">Confirm with passkey</button>
            <button id="step-up-cancel" type="button">Cancel</button>
        </div>
    </dialog>
    <script src="/static/passkeys.js"></script>
    <script src="/static/step_up.js"></script>
</body>
</html>
