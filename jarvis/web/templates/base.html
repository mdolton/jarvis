<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Jarvis{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">Jarvis</a>
        <nav>
            <a href="/">Home</a>
            <a href="/conversations">Conversations</a>
            <a href="/memory">Memory</a>
            <a href="/schedules">Schedules</a>
            <a href="/templates">Templates</a>
            <a href="/actions">Actions</a>
            <a href="/mcp">MCP</a>
            <a href="/errors">Errors</a>
            <a href="/audit">Audit</a>
            <a href="/settings">Settings</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <dialog id="step-up-modal" class="step-up-modal">
        <h2>Confirm it's you</h2>
        <p>This action touches sensitive settings and needs a fresh passkey confirmation.</p>
        <p id="step-up-error" class="step-up-error"></p>
        <div class="step-up-buttons">
            <button id="step-up-confirm" type="button">Confirm with passkey</button>
            <button id="step-up-cancel" type="button">Cancel</button>
        </div>
    </dialog>
    <script src="/static/passkeys.js"></script>
    <script src="/static/step_up.js"></script>
</body>
</html>
