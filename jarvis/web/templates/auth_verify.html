<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jarvis — enter code</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="auth-card">
        <h1>Jarvis</h1>
        <p class="auth-hint">If that address can sign in here, a 6-digit code is
        on its way. It expires in {{ code_ttl_minutes }} minutes and only works
        in this browser.</p>
        {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
        <form method="post" action="/auth/verify">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}"
                   maxlength="6" placeholder="123456" required autofocus
                   autocomplete="one-time-code">
            <button type="submit">Sign in</button>
        </form>
        <p class="auth-hint"><a href="/auth/login">Use a different email or
        request a new code</a></p>
    </main>
</body>
</html>
