services:
  jarvis:
    build: .
    restart: unless-stopped
    # Run as the host owner of ./data so the non-root container can create the
    # SQLite DB on the bind mount. Set JARVIS_UID/JARVIS_GID in .env to match.
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    ports:
      - "${JARVIS_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - JARVIS_LLM_BASE_URL
      - JARVIS_LLM_API_KEY
      - JARVIS_LLM_MODEL
      - JARVIS_MEMORY_EMBEDDING_MODEL
      - JARVIS_MEMORY_EMBEDDING_DIMENSIONS
      - JARVIS_DISCORD_TOKEN
      - JARVIS_DISCORD_ALLOWED_USER_IDS
      - JARVIS_TIMEZONE
      - JARVIS_LOG_LEVEL
      - JARVIS_BASE_URL
      - JARVIS_SECRETS_KEY
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
    extra_hosts:
      - "host.docker.internal:host-gateway"
